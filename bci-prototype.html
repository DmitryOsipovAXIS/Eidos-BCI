<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eidos BCI · Click Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .app {
            width: 1300px;
            height: 850px;
            background: #0b0d12;
            background: radial-gradient(ellipse at 30% 40%, #141820 0%, #090b0f 90%);
            border-radius: 70px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Splash screen */
        .splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0c12;
            border-radius: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #aab5d0 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(100, 150, 255, 0.3);
        }

        .logo-sub {
            font-size: 1.1rem;
            letter-spacing: 8px;
            color: #6f7c9f;
            font-weight: 300;
            margin-bottom: 80px;
        }

        .splash-buttons {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }

        .splash-btn {
            width: 220px;
            height: 220px;
            border-radius: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(20, 25, 35, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
        }

        .splash-btn:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(40, 50, 65, 0.8);
        }

        .splash-btn.enter {
            background: rgba(30, 45, 60, 0.8);
            box-shadow: 0 0 30px rgba(70, 130, 200, 0.3);
        }

        .splash-btn.enter .btn-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .splash-btn.power {
            background: rgba(40, 25, 25, 0.8);
        }

        .splash-btn.power .btn-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .splash-btn .btn-label {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Main interface */
        .main-interface {
            flex: 1;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 100%;
        }

        .main-interface.visible {
            opacity: 1;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .exit-button {
            width: 70px;
            height: 70px;
            border-radius: 30px;
            background: rgba(30, 35, 45, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 2rem;
            color: #b5c0d0;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .exit-button:hover {
            background: rgba(50, 40, 40, 0.8);
            border-color: rgba(255, 120, 120, 0.3);
            color: #ffb0b0;
            transform: scale(1.02);
        }

        .exit-button span {
            font-size: 1.8rem;
            line-height: 1;
        }

        .exit-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Context area */
        .context-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
        }

        .category-icon {
            font-size: 8rem;
            margin-bottom: 30px;
            filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.5));
            opacity: 0.9;
        }

        .category-title {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(100, 160, 255, 0.4);
        }

        .category-description {
            font-size: 1.4rem;
            color: #8f9bb5;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .instruction {
            margin-top: 50px;
            font-size: 1.2rem;
            color: #5f6b85;
            letter-spacing: 2px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 30px;
            width: 60%;
            text-align: center;
        }

        /* Bottom buttons */
        .bottom-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            margin-top: auto;
        }

        .action-btn {
            width: 280px;
            height: 200px;
            border-radius: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(20, 25, 35, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .btn-left {
            background: linear-gradient(145deg, #1a2a35, #0f1a22);
        }

        .btn-left:hover {
            background: linear-gradient(145deg, #1f3340, #14212b);
            border-color: rgba(100, 180, 255, 0.3);
        }

        .btn-right {
            background: linear-gradient(145deg, #2a3a2a, #1a251a);
        }

        .btn-right:hover {
            background: linear-gradient(145deg, #334833, #223322);
            border-color: rgba(120, 220, 120, 0.3);
        }

        .btn-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }

        .btn-label {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .btn-hint {
            font-size: 1rem;
            opacity: 0.5;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Status indicator */
        .status-indicator {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #4a5670;
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-weight: 300;
            padding: 8px 18px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Splash Screen -->
        <div class="splash" id="splash">
            <div class="logo">EIDOS</div>
            <div class="logo-sub">BRAIN COMPUTER INTERFACE</div>
            <div class="splash-buttons">
                <div class="splash-btn enter" id="splashEnter">
                    <div class="btn-icon">⏵</div>
                    <div class="btn-label">ENTER</div>
                </div>
                <div class="splash-btn power" id="splashPower">
                    <div class="btn-icon">⏸</div>
                    <div class="btn-label">EXIT</div>
                </div>
            </div>
            <div style="margin-top: 80px; font-size: 0.9rem; color: #3b4257; letter-spacing: 2px;">
                CLICK · CONTROL · INTENT
            </div>
        </div>
        <!-- Main Interface -->
        <div class="main-interface" id="mainInterface">
            <div class="top-bar">
                <div class="exit-button" id="exitButton">
                    <span>←</span>
                    <div class="exit-label">EXIT</div>
                </div>
            </div>
            <div class="status-indicator" id="statusIndicator">MAIN MENU</div>
            <div class="context-area">
                <div class="category-icon" id="categoryIcon">🎬</div>
                <div class="category-title" id="categoryTitle">MAIN MENU</div>
                <div class="category-description" id="categoryDesc">choose category</div>
                <div class="instruction" id="instruction">← next · select →</div>
            </div>
            <div class="bottom-buttons">
                <div class="action-btn btn-left" id="leftBtn">
                    <div class="btn-icon" id="leftIcon">⟳</div>
                    <div class="btn-label" id="leftLabel">NEXT</div>
                    <div class="btn-hint" id="leftHint">cycle</div>
                </div>
                <div class="action-btn btn-right" id="rightBtn">
                    <div class="btn-icon" id="rightIcon">⏵</div>
                    <div class="btn-label" id="rightLabel">SELECT</div>
                    <div class="btn-hint" id="rightHint">enter</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Categories for main menu
        const categories = [
            { id: 'help', icon: '🆘', title: 'HELP', desc: 'call assistance' },
            { id: 'movie', icon: '🎬', title: 'MOVIE', desc: 'watch films' },
            { id: 'music', icon: '🎵', title: 'MUSIC', desc: 'listen to music' }
        ];
        
        // State
        let currentScreen = 'splash'; // 'splash', 'mainMenu', 'help', 'movie', 'music'
        let currentCategoryIndex = 0;
        
        // DOM elements
        const splash = document.getElementById('splash');
        const mainInterface = document.getElementById('mainInterface');
        const splashEnter = document.getElementById('splashEnter');
        const splashPower = document.getElementById('splashPower');
        const exitButton = document.getElementById('exitButton');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const leftIcon = document.getElementById('leftIcon');
        const leftLabel = document.getElementById('leftLabel');
        const leftHint = document.getElementById('leftHint');
        const rightIcon = document.getElementById('rightIcon');
        const rightLabel = document.getElementById('rightLabel');
        const rightHint = document.getElementById('rightHint');
        const categoryIcon = document.getElementById('categoryIcon');
        const categoryTitle = document.getElementById('categoryTitle');
        const categoryDesc = document.getElementById('categoryDesc');
        const instruction = document.getElementById('instruction');
        const statusIndicator = document.getElementById('statusIndicator');
        
        // ----- Event Listeners (CLICK, not hover) -----
        splashEnter.addEventListener('click', () => {
            if (currentScreen === 'splash') {
                currentScreen = 'mainMenu';
                splash.classList.add('hidden');
                mainInterface.classList.add('visible');
                updateMainMenuUI();
            }
        });
        
        splashPower.addEventListener('click', () => {
            if (currentScreen === 'splash') {
                alert('Eidos BCI · power off (simulated)');
            }
        });
        
        exitButton.addEventListener('click', () => {
            if (currentScreen === 'mainMenu') {
                // Back to splash from main menu
                currentScreen = 'splash';
                splash.classList.remove('hidden');
                mainInterface.classList.remove('visible');
            } else {
                // From inside a category, back to main menu
                currentScreen = 'mainMenu';
                updateMainMenuUI();
            }
        });
        
        leftBtn.addEventListener('click', () => {
            if (currentScreen === 'mainMenu') {
                // Cycle categories
                currentCategoryIndex = (currentCategoryIndex + 1) % categories.length;
                updateMainMenuUI();
            } else {
                // Inside a category
                showCategoryFeedback('← back');
            }
        });
        
        rightBtn.addEventListener('click', () => {
            if (currentScreen === 'mainMenu') {
                // Enter selected category
                const category = categories[currentCategoryIndex];
                enterCategory(category.id);
            } else {
                // Inside a category
                showCategoryFeedback('✓ selected');
            }
        });
        
        // ----- UI Update Functions -----
        function updateMainMenuUI() {
            currentScreen = 'mainMenu';
            const cat = categories[currentCategoryIndex];
            
            statusIndicator.innerText = 'MAIN MENU';
            categoryIcon.innerText = cat.icon;
            categoryTitle.innerText = cat.title;
            categoryDesc.innerText = cat.desc;
            instruction.innerText = '← next · select →';
            
            leftLabel.innerText = 'NEXT';
            leftIcon.innerText = '⟳';
            leftHint.innerText = 'cycle';
            
            rightLabel.innerText = 'SELECT';
            rightIcon.innerText = '⏵';
            rightHint.innerText = 'enter';
        }
        
        function enterCategory(categoryId) {
            currentScreen = categoryId;
            
            statusIndicator.innerText = categoryId.toUpperCase() + ' MODE';
            
            if (categoryId === 'help') {
                categoryIcon.innerText = '🆘';
                categoryTitle.innerText = 'HELP';
                categoryDesc.innerText = 'emergency call';
                instruction.innerText = '← cancel · call →';
            } else if (categoryId === 'movie') {
                categoryIcon.innerText = '🎬';
                categoryTitle.innerText = 'MOVIE';
                categoryDesc.innerText = 'browse films';
                instruction.innerText = '← previous · select →';
            } else if (categoryId === 'music') {
                categoryIcon.innerText = '🎵';
                categoryTitle.innerText = 'MUSIC';
                categoryDesc.innerText = 'choose playlist';
                instruction.innerText = '← previous · play →';
            }
            
            leftLabel.innerText = '←';
            leftIcon.innerText = '←';
            leftHint.innerText = 'back';
            
            rightLabel.innerText = '✓';
            rightIcon.innerText = '✓';
            rightHint.innerText = 'select';
        }
        
        function showCategoryFeedback(action) {
            const originalDesc = categoryDesc.innerText;
            categoryDesc.innerText = action + ' ...';
            setTimeout(() => {
                if (currentScreen === 'help') categoryDesc.innerText = 'emergency call';
                else if (currentScreen === 'movie') categoryDesc.innerText = 'browse films';
                else if (currentScreen === 'music') categoryDesc.innerText = 'choose playlist';
            }, 500);
        }
        
        // Make sure we start with splash visible
        splash.classList.remove('hidden');
        mainInterface.classList.remove('visible');
    </script>
</body>
</html>
